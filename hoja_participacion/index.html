<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Documento</title>
    <style>
      body { font-family: sans-serif; margin: 0; padding: 20px; background: #f0f0f0; }
      .container { max-width: 1000px; margin: 0 auto; background: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
      canvas { width: 100%; height: auto; display: block; margin: 0 auto; border-bottom: 1px solid #eee; }
      .controls { text-align: center; padding: 15px; background: #f8f9fa; border-bottom: 1px solid #dee2e6; }
      button { padding: 8px 15px; margin: 0 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 14px; }
      button:hover { background: #0056b3; }
      button:disabled { background: #6c757d; cursor: not-allowed; }
      .page-info { margin: 0 15px; font-weight: bold; }
      .error { color: red; text-align: center; padding: 20px; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="controls">
        <button id="prev" disabled>&laquo; Anterior</button>
        <span class="page-info">Página <span id="page_num">...</span> de <span id="page_count">...</span></span>
        <button id="next" disabled>Siguiente &raquo;</button>
      </div>
      <div id="pdf-container">
        <canvas id="pdf-canvas"></canvas>
      </div>
      <div id="error-message" class="error" style="display: none;"></div>
    </div>

    <!-- Incluir PDF.js desde la CDN oficial -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.189/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.189/pdf.worker.min.js';
      // Reemplaza con la URL RAW de tu PDF
      const pdfUrl = 'https://raw.githubusercontent.com/ErikPhi/fase1_dev/main/hoja_participacion/Hoja%20de%20informaci%C3%B3n%20para%20participantes.pdf';

      let pdfDoc = null,
          pageNum = 1,
          pageRendering = false,
          pageNumPending = null,
          canvas = document.getElementById('pdf-canvas'),
          ctx = canvas.getContext('2d');

      function showError(message) {
        document.getElementById('error-message').textContent = message;
        document.getElementById('error-message').style.display = 'block';
        document.getElementById('pdf-container').style.display = 'none';
        document.getElementById('prev').disabled = true;
        document.getElementById('next').disabled = true;
      }

      function renderPage(num) {
        pageRendering = true;
        pdfDoc.getPage(num).then(function(page) {
          const viewport = page.getViewport({ scale: 1.5 });
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          const renderContext = {
            canvasContext: ctx,
            viewport: viewport
          };
          const renderTask = page.render(renderContext);

          renderTask.promise.then(function() {
            pageRendering = false;
            if (pageNumPending !== null) {
              renderPage(pageNumPending);
              pageNumPending = null;
            }
          });
        }).catch(function(error) {
          console.error('Error al renderizar la página:', error);
          showError('Error al mostrar la página. Por favor, intenta recargar.');
        });

        document.getElementById('page_num').textContent = num;
      }

      function queueRenderPage(num) {
        if (pageRendering) {
          pageNumPending = num;
        } else {
          renderPage(num);
        }
      }

      function onPrevPage() {
        if (pageNum <= 1) return;
        pageNum--;
        queueRenderPage(pageNum);
      }

      function onNextPage() {
        if (pageNum >= pdfDoc.numPages) return;
        pageNum++;
        queueRenderPage(pageNum);
      }

      pdfjsLib.getDocument(pdfUrl).promise.then(function(pdfDoc_) {
        pdfDoc = pdfDoc_;
        document.getElementById('page_count').textContent = pdfDoc.numPages;
        document.getElementById('prev').disabled = false;
        document.getElementById('next').disabled = false;
        renderPage(pageNum);
      }).catch(function(error) {
        console.error('Error al cargar el PDF:', error);
        let errorMsg = 'No se pudo cargar el documento. ';
        if (error.name === 'InvalidPDFException') {
          errorMsg += 'El archivo no es un PDF válido.';
        } else if (error.name === 'MissingPDFException') {
          errorMsg += 'No se encontró el archivo PDF. Verifica la URL.';
        } else {
          errorMsg += 'Error de red o el servidor no permite compartir el archivo.';
        }
        showError(errorMsg);
      });

      document.getElementById('prev').addEventListener('click', onPrevPage);
      document.getElementById('next').addEventListener('click', onNextPage);
    </script>
  </body>
</html>
